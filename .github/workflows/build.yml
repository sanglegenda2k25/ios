name: Build IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode version
      run: |
        sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || \
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: List available schemes
      run: |
        xcodebuild -project external/ThreeOneOSFive.xcodeproj -list

    - name: Build .app (unsigned)
      run: |
        xcodebuild \
          -project external/ThreeOneOSFive.xcodeproj \
          -scheme 3105 \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO

    - name: Find built .app
      run: find build/Build/Products -name "*.app" -type d

    - name: Create IPA
      run: |
        APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -1)
        echo "Found app: $APP_PATH"
        mkdir -p Payload
        cp -R "$APP_PATH" Payload/
        zip -r "KX-TEAM.ipa" Payload
        cp "KX-TEAM.ipa" REGSXD.ipa

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: KX-TEAM-unsigned-ipa
        path: "*.ipa"
